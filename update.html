<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Wholesale App</title>
<style>
body{font-family:Arial,sans-serif;padding:24px;background:#faf5ff;color:#222}
.box{max-width:560px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 6px 24px #0002}
h1{color:#5b21b6}
button{background:#5b21b6;color:white;border:0;border-radius:10px;padding:14px 18px;font-size:17px;width:100%}
</style>
</head>
<body>
<div class="box">
<h1>Wholesale App Update 5.7.4</h1>
<p>This page clears the old app cache and loads the newest version.</p>
<button id="go">Clear Old Cache & Open V5.7.4</button>
<p id="status"></p>
</div>
<script>
document.getElementById("go").onclick=async()=>{
  const s=document.getElementById("status");
  s.textContent="Updating...";
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
    localStorage.setItem("last_force_update","5.7.4");
    s.textContent="Done. Opening new app...";
    setTimeout(()=>location.href="./index.html?v=574&t="+Date.now(),500);
  }catch(e){
    s.textContent="Could not clear cache automatically. Open index.html?v=574 in Chrome.";
  }
};
</script>
</body>
</html>
